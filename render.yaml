services:
  - type: web
    name: langmind-file-generator
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FILE_STORAGE_DIR
        value: /tmp/generated_files
      - key: FILE_TTL_SECONDS
        value: "86400"
